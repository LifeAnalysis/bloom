[package]
name = "bloom-solana-driver-petal"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "0.51"

solana-message = { version = "4.5.0", default-features = false, features = ["wincode"] }
solana-system-interface = { version = "3.3.0", default-features = false, features = ["bincode"] }

[profile.release]
# Deterministic artifacts across clean builds: no incremental machinery,
# stable codegen, panic on overflow like the fixture profile.
incremental = false
panic = "abort"
