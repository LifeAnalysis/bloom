[package]
edition = "2021"
name = "mpp"
version = "0.10.4"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust SDK for the Machine Payments Protocol (MPP)"
homepage = "https://github.com/tempoxyz/mpp-rs"
documentation = "https://tempoxyz.github.io/mpp-rs"
readme = "README.md"
keywords = [
    "http",
    "payments",
    "402",
    "authentication",
]
categories = [
    "web-programming",
    "authentication",
    "cryptography",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tempoxyz/mpp-rs"

[features]
axum = [
    "dep:axum-core",
    "server",
    "http-types",
]
client = ["dep:reqwest"]
default = ["reqwest-default-tls"]
evm = [
    "alloy",
    "dep:alloy-sol-type-parser",
    "dep:alloy-sol-types",
    "hex",
    "rand",
]
integration = [
    "tempo",
    "server",
    "client",
    "axum",
]
integration-stripe = [
    "stripe",
    "server",
    "client",
    "axum",
]
integration-ws = [
    "ws",
    "tempo",
    "server",
    "client",
    "axum",
]
middleware = [
    "client",
    "reqwest-middleware",
    "async-trait",
    "anyhow",
    "http-types",
]
reqwest-default-tls = ["reqwest?/default-tls"]
reqwest-native-tls = ["reqwest?/native-tls"]
reqwest-rustls-tls = ["reqwest?/rustls"]
server = [
    "tokio",
    "futures-core",
    "async-stream",
    "http-types",
]
stripe = [
    "dep:reqwest",
    "reqwest?/form",
]
tempo = [
    "evm",
    "tempo-alloy",
    "tempo-primitives",
    "dep:tempo-contracts",
    "uuid",
]
tower = [
    "dep:tower-layer",
    "dep:tower-service",
    "http-types",
    "dep:http-body",
    "server",
]
utils = [
    "hex",
    "rand",
]
