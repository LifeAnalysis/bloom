[package]
name = "bloom-chain-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chain-neutral Machine RPC mediation, fault-injection harness, and blockhash freshness evaluation for verified chain Petals"

[features]
default = []
# Real Solana JSON-RPC HTTP transport (tests against local validators).
http = ["dep:ureq", "dep:url"]

[dependencies]
bloom-chain-action.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bs58.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
ureq = { version = "2", default-features = false, optional = true, features = ["tls", "json"] }
url = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
