[package]
name = "bloom-chain-driver-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Machine-owned generic host for verified chain-driver Petals: mediated RPC + durable outbox wiring, package pin verification, and operator profile configuration. Chain-neutral by construction — carries no chain-specific constant or type."

[features]
default = []
# Enables real HTTP transports for the configured profiles (off by default so
# non-networked builds/tests never link a JSON-RPC HTTP client).
http = ["bloom-chain-rpc/http"]

[dependencies]
bloom-chain-action.workspace = true
bloom-chain-rpc.workspace = true
bloom-petals.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
blake3.workspace = true

[dev-dependencies]
tempfile.workspace = true
