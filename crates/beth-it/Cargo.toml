[package]
name = "beth-it"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "End-to-end integration tests for bloom-eth"
publish = false

[features]
default = []
# Forwards to beth-revert/bytecode-decompile so the heimdall-fallback
# integration test (`tests/revert_decoding_fallbacks.rs`) compiles.
bytecode-decompile = ["beth-revert/bytecode-decompile"]

[dependencies]
beth-proto.workspace = true
beth-keystore.workspace = true
beth-chain.workspace = true
beth-tx.workspace = true
beth-vfs.workspace = true
beth-daemon.workspace = true
beth-revert.workspace = true
alloy.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
serde_json.workspace = true
hex.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
