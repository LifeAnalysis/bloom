[package]
name = "bloom-solana-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Devnet-first Solana CLI: enable accounts, stage/confirm/cancel native transfers, inspect and retry"

[lib]
name = "bloom_solana_cli"
path = "src/lib.rs"

[[bin]]
name = "bloom-solana"
path = "src/bin/bloom_solana.rs"

[dependencies]
bloom-chain-action.workspace = true
bloom-chain-rpc.workspace = true
bloom-solana.workspace = true
bloom-solana-machine.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
ed25519-dalek.workspace = true

[features]
default = []
http = ["bloom-chain-rpc/http", "bloom-solana-machine/http"]

[dev-dependencies]
bs58.workspace = true
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
