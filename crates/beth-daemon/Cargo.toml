[package]
name = "beth-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Daemon library wiring VFS + chain + tx + mount for bloom-eth"

[features]
default = []
# Forward to beth-mount/mount: enables `Daemon::mount(path)` and pulls
# in the embednfs server. Off by default so the default daemon build
# stays portable (no embednfs git dep, no kernel NFS tooling).
mount = ["beth-mount/mount"]

[dependencies]
beth-proto.workspace = true
beth-keystore.workspace = true
beth-chain.workspace = true
beth-tx.workspace = true
beth-vfs.workspace = true
beth-tools.workspace = true
beth-defi.workspace = true
beth-watch.workspace = true
beth-mount.workspace = true
beth-ens.workspace = true
beth-etherscan.workspace = true
beth-prices.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
alloy.workspace = true
url.workspace = true
base64.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
