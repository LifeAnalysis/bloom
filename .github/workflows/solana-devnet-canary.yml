name: solana devnet canary

on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Enable broadcast to devnet (explicit release gate)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: solana-devnet-canary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  devnet-canary:
    name: devnet read/stage canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Genesis-bound read/stage canary
        run: |
          BLOOM_SOLANA_CANARY_BROADCAST="${{ inputs.broadcast }}" \
            cargo test -p bloom-solana-cli --features http \
              --test devnet_canary -- --ignored --test-threads=1 --nocapture
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
