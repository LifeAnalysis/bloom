name: Triad release gate

on:
  workflow_dispatch:
    inputs:
      broker_ref:
        description: bloom-broker ref
        required: true
      signer_ref:
        description: bloom-signer ref
        required: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Machine
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: bloom
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Broker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-broker
          ref: ${{ inputs.broker_ref }}
          path: bloom-broker
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Signer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: bloom-directory/bloom-signer
          ref: ${{ inputs.signer_ref }}
          path: bloom-signer
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Run locked triad release gate
        working-directory: bloom
        run: packaging/triad/release/triad-release-gate.sh --test-signing-key
