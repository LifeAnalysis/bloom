name: solana local validator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/solana-validator.yml"
      - "crates/bloom-solana/**"
      - "crates/bloom-chain-action/**"
      - "crates/bloom-chain-rpc/**"
      - "crates/bloom-solana-machine/**"
      - "petals/solana-driver/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: solana-validator-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  adversarial-simulated-rpc:
    name: adversarial simulated-RPC suite
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Run the fault-injection and restart suites
        run: |
          cargo test -p bloom-chain-rpc \
          cargo test -p bloom-solana-machine --test machine_loop \
          cargo test -p bloom-solana-machine --test projections \
          cargo test -p bloom-solana-cli
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  local-validator-e2e:
    name: e2e on pinned agave validator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install pinned agave v3.0.0 validator
        run: |
          curl -sSL -o /tmp/agave-install.sh https://release.anza.xyz/v3.0.0/install
          echo "7d588d188cb9ea550434cabc62a9927cf75de22e1aeb2a87f2352071812944fb  /tmp/agave-install.sh" | sha256sum -c -
          sh /tmp/agave-install.sh v3.0.0
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana-test-validator --version
          agave-solana-test-validator --version 2>/dev/null || true
      - name: Start local validator
        run: |
          solana-test-validator \
            --rpc-port 8899 \
            --quiet \
            > "$RUNNER_TEMP/validator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/validator.pid"
          for i in $(seq 1 60); do
            if curl -s -X POST -H 'content-type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
                 http://127.0.0.1:8899 | grep -q '"result":"ok"'; then
              echo "validator healthy"
              exit 0
            fi
            sleep 1
          done
          echo "validator failed to become healthy"
          cat "$RUNNER_TEMP/validator.log" || true
          exit 1
      - name: Run end-to-end lifecycle and restart tests
        run: |
          mkdir -p e2e-state
          BLOOM_SOLANA_E2E_STATE="$GITHUB_WORKSPACE/e2e-state" \
          SOLANA_VALIDATOR_HTTP=http://127.0.0.1:8899 \
            cargo test -p bloom-solana-machine \
            --features bloom-chain-rpc/http \
            --test local_validator -- --ignored --test-threads=1 --nocapture
      - name: Validator log
        if: always()
        run: cat "$RUNNER_TEMP/validator.log" || true
      - name: Preserve operation projections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-e2e-projections
          path: e2e-state/
          if-no-files-found: ignore
      - name: Stop validator
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/validator.pid" ] && kill "$(cat "$RUNNER_TEMP/validator.pid")" || true
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
